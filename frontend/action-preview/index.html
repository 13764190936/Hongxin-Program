<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸿心 · 每日行动</title>
<style>
:root{--paper:#f5f4ef;--ink:#223b32;--muted:#7e8c83;--green:#23654e;--line:#e4e7de;--gold:#b58345;--white:#fff;--soft:#eaf0e8}*{box-sizing:border-box}body{margin:0;background:#e8eae3;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b8965c;outline-offset:3px}button{border:0;color:inherit}button:disabled{cursor:default;opacity:.5}.app{max-width:1120px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100dvh}.rail{padding:40px 24px;border-right:1px solid #d8ded3;position:sticky;top:0;height:100dvh}.brand{font-size:26px;font-weight:700;letter-spacing:3px}.brand small{display:block;font-size:10px;letter-spacing:3px;color:var(--muted);font-weight:500}.railnav{display:grid;gap:8px;margin-top:56px}.railnav button{text-align:left;padding:14px 16px;border-radius:12px;background:none;color:#7a867c}.railnav button.on{background:#dce4d8;color:var(--green);font-weight:600}.railfoot{position:absolute;bottom:30px;font-size:11px;color:#7b897c}.main{min-width:0;background:var(--paper);padding:36px 44px 100px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-bottom:30px}.badge{display:inline-block;padding:3px 9px;background:#e6ece2;border-radius:20px;font-size:10px;color:#5b735f}.avatar{height:38px;width:38px;display:inline-grid;place-items:center;background:#e7e5d8;color:#6e704f;border-radius:50%;font-weight:600}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.heading{font-size:30px;letter-spacing:-1px;font-weight:600;margin:5px 0 8px}.sub{color:var(--muted);font-size:12px}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.section{margin-top:28px}.section h2{font-size:16px;font-weight:600;margin:0}.link{color:var(--green);background:transparent;padding:4px;font-size:12px}.hero{margin-top:25px;background:var(--green);color:white;border-radius:22px;padding:24px;position:relative;overflow:hidden}.hero:after{content:"";width:220px;height:220px;border:1px solid #ffffff16;border-radius:50%;position:absolute;right:-70px;top:-85px;pointer-events:none}.hero .eyebrow{color:#b5d0bd}.hero h2{font-size:18px;margin:7px 0 4px;font-weight:500}.hero p{font-size:12px;color:#bed2c3;margin:0}.progressline{height:4px;background:#ffffff25;border-radius:8px;margin-top:23px;overflow:hidden}.progressline span{display:block;height:100%;background:#d6dfab;transition:width .3s}.progresslabels{display:flex;justify-content:space-between;font-size:11px;color:#c4d7c7;margin-top:8px}.tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.task{border-radius:18px;background:white;padding:18px;text-align:left;border:1px solid #e9ece3;position:relative;min-width:0}.task:hover{border-color:#aabca9}.task .symbol{width:34px;height:34px;border-radius:11px;background:#f1f0e6;color:#8b8354;display:grid;place-items:center;font-size:19px;margin-bottom:16px}.task .tag{position:absolute;right:15px;top:19px;font-size:10px;color:#8c917d}.task h3{margin:0;font-size:16px;font-weight:600}.task p{font-size:11px;color:var(--muted);margin:5px 0 20px}.task .foot{font-size:11px;display:flex;justify-content:space-between;color:var(--green);align-items:center}.task.done .symbol{background:#e5eee5;color:var(--green)}.task.done .tag{color:var(--green)}.course{display:flex;gap:14px;align-items:center;margin-top:14px;background:#ecece3;padding:17px;border-radius:16px}.course-cover{width:50px;height:64px;border-radius:5px 10px 10px 5px;flex-shrink:0;background:#b39d76;color:#fff8e5;padding:9px 6px;font-size:11px;box-shadow:inset 4px 0 #ffffff22;display:grid;place-items:center}.course-title{font-size:14px;font-weight:600}.quote{padding:23px 4px;text-align:center;font-size:12px;color:#a1a58f;letter-spacing:1px}.bottom{display:none}.back{background:transparent;color:var(--green);padding:0 0 20px;font-size:13px}.detail-title{font-size:27px;margin:0;font-weight:600}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:23px;margin-top:20px}.primary{background:var(--green);color:white;border-radius:13px;padding:14px 18px;width:100%;font-size:14px;font-weight:500}.secondary{background:#e8ede4;border-radius:12px;padding:12px 16px;color:var(--green)}.buttonrow{display:flex;gap:8px;margin-top:16px}.buttonrow>*{flex:1}.note{font-size:11px;color:var(--muted);margin-top:12px}.time{font:500 62px/1.2 ui-monospace,Menlo,monospace;letter-spacing:-4px;margin:34px 0 14px;text-align:center}.time small{font-size:18px;letter-spacing:0}.window{text-align:center;font-size:11px;color:var(--muted)}.seg{display:flex;gap:4px;flex-wrap:wrap;background:#e9ece3;border-radius:12px;padding:4px;margin-top:20px}.seg button{flex:1;white-space:nowrap;border-radius:9px;padding:8px 10px;font-size:12px;background:none;color:var(--muted)}.seg button.on{background:white;color:var(--green);box-shadow:0 2px 5px #1a332509}.upload{border:1px dashed #c4cdbb;border-radius:15px;padding:28px 16px;text-align:center;background:#f8f9f4;display:block;cursor:pointer}.upload input{display:none}.upload b{display:block;font-size:14px;font-weight:500}.upload .plus{font-size:30px;color:#9cac8e}.upload small{color:var(--muted);font-size:11px}.photo{max-height:180px;width:100%;object-fit:contain;border-radius:10px;margin-bottom:12px}.formlabel{display:block;font-size:12px;margin-bottom:6px;color:#687d6e}.field{margin-top:16px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbf7;color:var(--ink);min-width:0}.row{display:flex;gap:12px}.row .field{flex:1;min-width:0}.metric{font-size:32px;font-weight:500;letter-spacing:-1px}.metric small{font-size:12px;color:var(--muted);letter-spacing:0}.pill{background:#edf1e6;color:#6e805e;border-radius:20px;padding:4px 9px;font-size:11px}.rankrow{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #edf0e6}.rankrow:last-child{border-bottom:0}.position{width:24px;color:#9b9f89;font:500 14px ui-monospace,monospace}.position.top{color:#ae8651}.grow{flex:1;min-width:0}.rname{font-size:13px;font-weight:500}.rsub{font-size:10px;color:var(--muted);margin-top:2px}.value{font-size:18px;font-weight:500;white-space:nowrap}.value small{display:block;color:var(--muted);font-size:10px;text-align:right}.me{background:#eef3e7;border-radius:14px;padding:14px;margin-top:15px}.empty{text-align:center;padding:35px 12px;color:var(--muted);font-size:12px}.record{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.record:last-child{border-bottom:0}.success{background:#e9f1e6;border-radius:14px;padding:16px;margin-top:16px;color:#356344;font-size:13px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);max-width:85%;background:#223b32;color:white;padding:12px 18px;border-radius:12px;font-size:12px;z-index:30}.previewbar{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;font-size:10px;color:#9b9e8d}.previewbar summary{cursor:pointer}.previewbar button{margin-top:8px;font-size:11px;padding:6px 10px;border-radius:7px;background:#e9ece3;margin-right:4px}.timer-controls{display:flex;gap:8px;margin-top:25px}.timer-controls>*{flex:1}.running{width:7px;height:7px;background:#659166;border-radius:50%;display:inline-block;margin-right:6px}dialog{border:0;border-radius:20px;padding:26px;max-width:350px;width:90%;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#172d2455}dialog h3{margin:0 0 10px}dialog p{font-size:12px;color:#6c7d70}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:1000px){.main{padding:40px 65px 90px}.tasks{gap:16px}.task{padding:22px}}
@media(max-width:700px){body{background:var(--paper)}.app{display:block}.rail{display:none}.main{padding:22px 20px 105px}.topline{margin-bottom:22px}.heading{font-size:28px}.hero{padding:22px;margin-top:22px}.tasks{gap:10px}.task{padding:16px}.task h3{font-size:15px}.task p{font-size:11px;min-height:34px;margin-bottom:14px}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#f9faf5f5;border-top:1px solid #e2e7da;padding:10px 10px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(14px);z-index:10}.bottom button{background:none;flex:1;color:#9ba58f;font-size:10px;padding:3px}.bottom button.on{color:var(--green)}.bottom .navicon{display:block;font-size:20px;line-height:1.4;margin-bottom:2px}.time{font-size:56px}.panel{padding:20px}.seg button{padding:8px 5px}.detail-title{font-size:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app"><aside class="rail"><div class="brand">鸿心<small>GROW THROUGH ACTION</small></div><nav class="railnav" aria-label="主导航"></nav><div class="railfoot">与团队一起，把成长变成日常。<br><span class="badge">前端设计提案 · 模拟数据</span></div></aside><main class="main" id="main"></main></div><nav class="bottom" aria-label="底部导航"></nav><div id="live" class="sr" aria-live="polite"></div><dialog id="confirm"><h3>记录一次拜访</h3><p>本次只记录“完成一次拜访”的自行申报，不填写客户信息。每天可记录几次，后续再确认。</p><p>当前为预览，只更新本页模拟记录，不上传任何数据。</p><div class="buttonrow"><button class="secondary" id="cancelVisit">取消</button><button class="primary" id="confirmVisit">确认记录</button></div></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navs=[['today','◷','今天'],['learning','▤','课程'],['rank','↗','排行'],['teams','♧','团队'],['mine','○','我的']];
const state={page:'today',done:{early:false,run:false,read:false,visit:false},early:'before',scope:'小组',rankType:'综合行动',readSeconds:0,running:false,photo:null,ocr:false,runData:{distance:'3.20',minutes:'26',steps:'4280'},records:[],lastRead:null,myTeam:null,teamSearch:'',teamView:'demo-team-1'};let tick=null,toastTimer=null;
let team='尚未加入团队'; const org='星禾企业',course='卓越成长 · 21天行动营';
function showToast(t){let old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);$('#live').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3500)}
function nav(page){state.page=page;render();window.scrollTo(0,0)}
function iconButton(id,ico,label){return `<button data-page="${id}" class="${state.page===id?'on':''}"><span class="navicon">${ico}</span> ${label}</button>`}
function render(){const active=['early','run','read','visit'].includes(state.page)?'today':['teamCreate','teamBrowse','teamDetail'].includes(state.page)?'teams':state.page;$('.railnav').innerHTML=navs.map(([id,i,t])=>iconButton(id,i,t).replace(state.page===id?'class="on"':'class=""',active===id?'class="on"':'class=""')).join('');$('.bottom').innerHTML=navs.map(([id,i,t])=>`<button data-page="${id}" class="${active===id?'on':''}"><span class="navicon">${i}</span>${t}</button>`).join('');$('#main').innerHTML=({today:today,early:early,run:run,read:read,visit:visit,learning:learning,rank:rank,mine:mine,teams:teams,teamCreate:teamCreate,teamBrowse:teamBrowse,teamDetail:teamDetail}[state.page]||today)();}
function pageHeader(){return `<div class="topline"><span>${org} / ${state.myTeam?esc(state.myTeam.name):'未加入团队'}</span><span class="badge">设计预览</span></div>`}function back(title,subtitle){return `${pageHeader()}<button class="back" data-page="today">← 返回今天</button><h1 class="detail-title">${title}</h1><div class="sub">${subtitle}</div>`}function preview(){return `<div class="previewbar">本页为前端交互演示，全部为模拟数据；没有连接服务器。</div>`}function count(){return Object.values(state.done).filter(Boolean).length}function task(id,symbol,title,desc,tag,action){return `<button class="task ${state.done[id]?'done':''}" data-page="${id}"><span class="tag">${state.done[id]?'✓ 已完成':tag}</span><span class="symbol">${symbol}</span><h3>${title}</h3><p>${desc}</p><span class="foot">${state.done[id]?'查看记录':action}<span>↗</span></span></button>`}
function today(){return `${pageHeader()}<div class="between"><div><div class="eyebrow">DAILY PRACTICE / 每日行动</div><h1 class="heading">让成长，发生在今天。</h1><div class="sub">${state.myTeam?'林清和，与你的团队一起向前一步。':'林清和，先找到一起行动的伙伴。'}</div></div><span class="avatar">清</span></div><section class="hero"><div class="eyebrow">正在参与的课程</div><h2>${course}</h2><p>知而行之，把每一天的小事做好。</p><div class="progressline"><span style="width:${count()/4*100}%"></span></div><div class="progresslabels"><span>第 08 / 21 天 · 模拟进度</span><span>今日行动 ${count()} / 4</span></div></section>${!state.myTeam?`<div class="course"><span class="avatar">♧</span><div class="grow"><div class="course-title">还没有加入团队</div><div class="sub">加入课程团队，一起完成每日行动</div></div><button class="link" data-page="teams">去加入 →</button></div>`:''}<section class="section"><div class="between"><h2>今天的行动</h2><span class="sub">从一件小事开始</span></div><div class="tasks">${task('early','☀','5:31 早起','北京时间 05:31 的整分钟','指定时间','查看打卡窗口')}${task('run','↗','晨跑','上传运动截图，确认运动数据','图片记录','上传截图')}${task('read','▤','阅读','完成今日指定内容，记录时长','团队任务','开始阅读')}${task('visit','⌁','拜访','完成行动后，一键记录','自主申报','记录拜访')}</div></section><section class="section"><div class="between"><h2>今天读什么</h2><button class="link" data-page="learning">课程与任务 →</button></div><div class="course"><div class="course-cover">知行<br>合一</div><div class="grow"><div class="course-title">《传习录》· 今日指定阅读</div><div class="sub">${state.myTeam?'团队共同任务':'课程示例任务 · 尚未加入团队'} · 阅读内容待课程方提供</div></div><button class="link" data-page="read">去阅读 ↗</button></div></section><div class="quote">积小步，至千里。</div>${preview()}`}
function early(){const status=state.done.early?'已记录早起行动':state.early==='open'?'打卡窗口已开启':state.early==='missed'?'今日窗口已结束':'等待打卡窗口';return `${back('从 5:31，开启今天。','早起行动 / EARLY START')}<section class="panel"><div class="between"><span class="pill">${status}</span><span class="sub">北京时间</span></div><div class="time">${state.early==='open'?'05:31':state.early==='missed'?'05:32':'05:30'}<small>:${state.early==='open'?'18':'00'}</small></div><div class="window">有效窗口 05:31:00 — 05:31:59</div><div style="margin-top:32px"><button class="primary" data-action="early" ${state.early!=='open'||state.done.early?'disabled':''}>${state.done.early?'✓ 今日已完成':state.early==='open'?'现在打卡':state.early==='missed'?'已错过今日打卡':'未到打卡时间'}</button></div><div class="note">正式版以服务器时间判定。这里的时间为模拟场景，不代表当前真实时间。</div>${state.done.early?'<div class="success">✓ 模拟记录成功 · 05:31:18</div>':''}</section><details class="previewbar"><summary>预览不同时间状态</summary><button data-early="before">未到时间</button><button data-early="open">窗口开放</button><button data-early="missed">已过时间</button></details>${preview()}`}
function run(){return `${back('跑过的路，都有记录。','晨跑行动 / MORNING RUN')}<section class="panel"><div class="between"><span class="eyebrow">01 / 上传运动截图</span><span class="sub">图片仅在本机预览</span></div><label class="upload" style="margin-top:16px">${state.photo?`<img class="photo" src="${state.photo}" alt="本机选择的运动截图">`:'<span class="plus">＋</span>'}<b>${state.photo?'重新选择截图':'选择运动截图'}</b><small>图片格式 JPG、PNG · 自动识别待后端接入</small><input id="runPhoto" type="file" accept="image/jpeg,image/png"></label><button class="secondary" style="width:100%;margin-top:12px" data-action="ocr">${state.photo?'预览识别结果（模拟）':'用示例数据体验流程'}</button></section>${state.ocr?`<section class="panel"><span class="eyebrow">02 / 确认运动数据</span><div class="note">以下是固定示例值，并非从图片中提取。识别服务及指标范围待确认。</div><div class="row"><div class="field"><label class="formlabel" for="distance">距离 / 公里</label><input id="distance" type="number" min="0" step=".01" value="${state.runData.distance}"></div><div class="field"><label class="formlabel" for="minutes">运动时长 / 分钟</label><input id="minutes" type="number" min="0" step="1" value="${state.runData.minutes}"></div></div><div class="field"><label class="formlabel" for="steps">步数</label><input id="steps" type="number" min="0" step="1" value="${state.runData.steps}"></div><button class="primary" style="margin-top:22px" data-action="run" ${state.done.run?'disabled':''}>${state.done.run?'✓ 已记录模拟晨跑':'确认并记录（模拟）'}</button>${state.done.run?'<div class="success">✓ 晨跑已加入本页行动记录</div>':''}</section>`:''}${preview()}`}
function duration(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function read(){return `${back('给阅读，留一段时间。','阅读行动 / READ & REFLECT')}<div class="course"><div class="course-cover">传习录</div><div><div class="course-title">今日指定阅读 · 团队共学</div><div class="sub">任务归属：${course}</div></div></div><section class="panel"><div class="between"><span class="eyebrow">今日任务</span><span class="pill">${team}</span></div><h2 style="font-size:18px;margin:18px 0 8px">知与行，从身边的一件事开始。</h2><p class="sub">阅读课程指定内容，并思考一件今天可以付诸行动的小事。此处为示例任务，实际章节和阅读材料由课程方提供。</p><div class="time" id="readTime">${duration(state.readSeconds)}</div><div class="window" id="timerState">${state.running?'<span class="running"></span>正在记录本次阅读':'本次阅读时长'}</div><div class="timer-controls"><button class="primary" data-action="timer">${state.running?'暂停计时':state.readSeconds?'继续阅读':'开始计时'}</button><button class="secondary" data-action="finishRead">结束阅读</button></div><div class="note">本地计时只演示体验，不证明真实阅读。离开页面会暂停；后台计时和正式完成标准待确认。</div></section>${state.lastRead!==null?`<section class="panel"><div class="between"><h2 style="font-size:16px;margin:0">本次阅读回顾</h2><span class="pill">${duration(state.lastRead)}</span></div><label style="display:flex;gap:10px;margin-top:20px;font-size:12px"><input id="readComplete" type="checkbox">我已完成今日指定阅读任务</label><div class="note">时长与任务完成分别记录；不会用达到某个分钟数自动判断完成。</div><button class="primary" style="margin-top:18px" data-action="read" ${state.done.read?'disabled':''}>${state.done.read?'✓ 阅读已记录':'保存阅读记录（模拟）'}</button></section>`:''}${preview()}`}
function visit(){return `${back('把行动，落在实处。','拜访行动 / MEET & CONNECT')}<section class="panel"><div class="eyebrow">今日拜访</div><div style="text-align:center;padding:35px 0"><span style="font-size:48px;color:#96a78b">⌁</span><h2 style="font-size:19px;font-weight:500">完成一次拜访，记录一次行动。</h2><p class="sub">当前不需要填写客户姓名、地址或拜访详情。</p></div><button class="primary" data-action="visit" ${state.done.visit?'disabled':''}>${state.done.visit?'✓ 本次拜访已记录':'我已完成拜访'}</button><div class="note">本轮用单次完成状态预览，不代表已确定每日次数上限。该记录属于员工自主申报。</div>${state.done.visit?'<div class="success">✓ 已加入模拟行动记录</div>':''}</section>${preview()}`}
function learning(){return `${pageHeader()}<div class="eyebrow">LEARN, THEN ACT</div><h1 class="heading">学有所行。</h1><div class="sub">每一门课程，连接日常里的行动。</div><section class="hero"><div class="eyebrow">我的课程 · 进行中</div><h2>${course}</h2><p>21天，一起培养持续行动的习惯。</p><div class="progressline"><span style="width:38%"></span></div><div class="progresslabels"><span>第08天 · 示例进度</span><span>${state.myTeam?esc(state.myTeam.name):'课程示例 · 未加入团队'}</span></div></section><section class="section"><h2>课程行动安排</h2><div class="panel" style="margin-top:12px">${[['early','☀','早起','每天05:31整分钟'],['run','↗','晨跑','上传运动截图'],['read','▤','指定阅读','阅读时长 + 团队任务'],['visit','⌁','拜访','完成后自主记录']].map(([id,i,t,d])=>`<div class="record"><span class="avatar">${i}</span><div class="grow"><div>${t}</div><div class="sub">${d}</div></div><button class="link" data-page="${id}">查看 →</button></div>`).join('')}</div></section><div class="panel"><span class="eyebrow">课程内容</span><p class="sub">视频、章节和正式学习材料尚未提供。本版先呈现课程与行动任务的关系，不虚构播放功能。</p></div>${preview()}`}
function rank(){const scopes=['小组','企业','全省','全国'];const people=[['周予安','向上同行 · 第一小组',19],['林清和',team,17],['陈以宁','知行小组',16],['顾行舟','向上同行 · 第二小组',15],['何一苇','知行小组',14]];return `${pageHeader()}<div class="eyebrow">GROW TOGETHER</div><h1 class="heading">同行，也向上。</h1><div class="sub">看见自己的坚持，也看见团队的力量。</div><div class="seg">${scopes.map(t=>`<button data-scope="${t}" class="${state.scope===t?'on':''}">${t}</button>`).join('')}</div><div class="seg" style="background:transparent;padding:0;gap:6px">${['综合行动','早起','晨跑','阅读','拜访'].map(t=>`<button data-ranktype="${t}" class="${state.rankType===t?'on':''}">${t}</button>`).join('')}</div><div class="note">${state.scope==='全省'?'模拟范围：浙江省':state.scope==='全国'?'模拟范围：全国':state.scope==='企业'?org:team} · 本课程 · 示例排行</div><div class="panel" style="margin-top:15px"><div class="between"><h2 style="font-size:16px;margin:0">${state.rankType}榜</h2><span class="badge">布局示意</span></div>${(state.scope==='小组'&&!state.myTeam?[]:people).map(([n,t,v],i)=>`<div class="rankrow"><span class="position ${i<3?'top':''}">0${i+1}</span><span class="avatar">${n.slice(-1)}</span><div class="grow"><div class="rname">${n}${n==='林清和'?' · 我':''}</div><div class="rsub">${esc(t)}</div></div><div class="value">${v}<small>示例值</small></div></div>`).join('')}${state.scope==='小组'&&!state.myTeam?'<div class="empty">尚未加入团队，暂无小组排名<br><button class="link" data-page="teams">去查找团队 →</button></div>':''}</div><div class="me between"><span>我的今日行动</span><b>${count()} / 4</b></div><div class="note">切换范围仅演示界面，暂用同一组固定示例数据；总分、周期、参与资格及各项目比较规则尚未确定，不计算真实名次。</div>${preview()}`}
function mine(){return `${pageHeader()}<div class="between"><div><div class="eyebrow">MY GROWTH</div><h1 class="heading">林清和</h1><div class="sub">${org} · ${team}</div></div><span class="avatar" style="width:55px;height:55px">清</span></div><div class="panel"><div class="between"><div><div class="sub">今日行动</div><div class="metric">${count()}<small> / 4 项</small></div></div><div><div class="sub">课程</div><div style="margin-top:9px">第08天 <span class="sub">/ 21天</span></div></div></div></div><section class="section"><div class="between"><h2>本次预览的行动记录</h2><span class="sub">${state.records.length}条</span></div><div class="panel" style="margin-top:12px">${state.records.length?state.records.map(r=>`<div class="record"><span class="pill">✓</span><div class="grow"><div>${esc(r.title)}</div><div class="sub">${esc(r.detail)}</div></div><span class="badge">模拟</span></div>`).join(''):'<div class="empty">还没有记录<br>去“今天”体验一次行动打卡。</div>'}</div></section><div class="course"><div class="course-cover">21<br>DAYS</div><div class="grow"><div class="course-title">${course}</div><div class="sub">课程、团队与个人记录相互关联</div></div><button class="link" data-page="learning">查看 →</button></div><details class="previewbar"><summary>预览说明与重置</summary><p>记录只保存在当前页面内存中，刷新即清空。不改变旧系统或GitHub中的真实数据。</p><button data-action="reset">清空本次模拟记录</button></details>${preview()}`}
const teamSamples=[
 {id:'demo-team-1',name:'向上同行',intro:'一起早起，一起行动。',members:12,city:'杭州',captain:'周予安',code:'HX531',mine:false},
 {id:'demo-team-2',name:'知行伙伴',intro:'把读过的道理，变成做过的事情。',members:8,city:'上海',captain:'何一苇',code:'HX218',mine:false},
 {id:'demo-team-3',name:'晨光小组',intro:'从清晨开始，积累每天的小进步。',members:16,city:'苏州',captain:'顾行舟',code:'HX608',mine:false}
];
function teamHeader(title,sub,returnPage='teams'){return `${pageHeader()}<button class="back" data-page="${returnPage}">← 返回团队</button><h1 class="detail-title">${title}</h1><div class="sub">${sub}</div>`}
function teams(){const t=state.myTeam;return `${pageHeader()}<div class="eyebrow">BETTER TOGETHER</div><h1 class="heading">找到一起行动的人。</h1><div class="sub">课程连接行动，团队让坚持更有力量。</div>${t?`<section class="hero"><div class="eyebrow">我的团队 · ${t.mine?'创建者':'成员'}</div><h2>${esc(t.name)}</h2><p>${esc(t.intro)}</p><div class="progresslabels" style="margin-top:22px"><span>${t.members}位伙伴 · ${esc(t.city)}</span><span>模拟团队</span></div></section><div class="buttonrow"><button class="primary" data-teamdetail="${t.id}">团队详情与成员</button><button class="secondary" data-action="invite">邀请伙伴</button></div>`:`<section class="panel"><span class="avatar">♧</span><h2 style="font-size:19px;margin-bottom:8px">你还没有加入团队</h2><p class="sub">可以查找课程团队，或通过邀请码找到伙伴。团队排行榜和团队任务将在加入后关联到这里。</p><button class="primary" data-page="teamBrowse" style="margin-top:18px">查找并加入团队</button></section>`}<div class="tasks"><button class="task" data-page="teamBrowse"><span class="symbol">⌕</span><h3>查找团队</h3><p>按名称浏览，或使用邀请码</p><span class="foot">寻找伙伴 →</span></button><button class="task" data-page="teamCreate"><span class="symbol">＋</span><h3>创建团队</h3><p>填写名称，发起一个课程行动团队</p><span class="foot">发起团队 →</span></button></div><div class="note">每人可加入几个团队、是否需要审核、创建者权限尚未确定；此版只演示单一当前团队，不代表正式规则。</div>${preview()}`}
function teamBrowse(){return `${teamHeader('找到你的行动团队。','搜索与邀请码仅查询本页的虚构团队')}<section class="panel"><label class="formlabel" for="teamQuery">团队名称 / 邀请码</label><div class="row"><input id="teamQuery" value="${esc(state.teamSearch)}" placeholder="试试“向上”或 HX531" style="width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px"><button class="secondary" data-action="searchTeam">查找</button></div><div class="note">示例邀请码：HX531、HX218、HX608</div></section><section class="section"><div class="between"><h2>课程行动团队</h2><span class="badge">模拟列表</span></div><div class="panel" style="margin-top:12px">${teamSamples.filter(t=>!state.teamSearch||t.name.includes(state.teamSearch)||t.code.toLowerCase().includes(state.teamSearch.toLowerCase())).map(t=>`<div class="record"><span class="avatar">${esc(t.name.slice(0,1))}</span><div class="grow"><div class="rname">${esc(t.name)}</div><div class="rsub">${t.members}人 · ${esc(t.city)}</div></div><button class="link" data-teamdetail="${t.id}">查看 →</button></div>`).join('')||'<div class="empty">没有找到团队，请换个名称或邀请码。</div>'}</div></section>${preview()}`}
function teamCreate(){return `${teamHeader('发起一支行动团队。','创建表单提案 · 不建立真实团队')}<section class="panel"><div class="field" style="margin-top:0"><label class="formlabel" for="teamName">团队名称</label><input id="teamName" placeholder="为一起坚持的伙伴起个名字"></div><div class="field"><label class="formlabel" for="teamIntro">团队口号 / 20字以内</label><input id="teamIntro" maxlength="20" placeholder="例如：一起早起，一起向前"></div><div class="field"><label class="formlabel" for="teamCity">所在城市</label><input id="teamCity" placeholder="例如：杭州"></div><div class="field"><label class="formlabel">关联课程</label><div class="course" style="margin:0"><span class="avatar">▤</span><div class="grow"><div class="rname">${course}</div><div class="rsub">当前参与的示例课程，关联方式待确认</div></div></div></div><button class="primary" style="margin-top:24px" data-action="createTeam">预览创建团队</button><div class="note">本原型要求填写名称和城市用于演示，正式必填项、重名校验及审核规则待确认。仅保存本次浏览器内存。</div></section>${preview()}`}
function teamDetail(){const t=teamSamples.find(t=>t.id===state.teamView)||teamSamples[0],joined=state.myTeam&&state.myTeam.id===t.id;const names=t.id==='demo-team-1'?['周予安','陈以宁','顾行舟']:t.id==='demo-team-2'?['何一苇','沈云','温听']:t.mine?['林清和']:['顾行舟','姜屿','罗盘'];return `${teamHeader(esc(t.name),'团队详情 / TEAM PROFILE', 'teamBrowse')}<section class="hero"><div class="eyebrow">${course}</div><h2>${esc(t.intro)}</h2><div class="progresslabels" style="margin-top:20px"><span>${t.members}位伙伴</span><span>${esc(t.city)}</span></div></section><div class="panel"><div class="between"><span>创建者</span><span>${esc(t.captain)}</span></div><div class="between" style="margin-top:12px"><span>当前状态</span><span class="pill">${joined?'已加入':'尚未加入'}</span></div><div class="note">仅展示虚构团队资料，企业及课程的可见范围需后端授权。</div></div><section class="section"><div class="between"><h2>团队伙伴</h2><span class="sub">部分模拟成员</span></div><div class="panel" style="margin-top:12px">${names.map(n=>`<div class="record"><span class="avatar">${esc(n.slice(-1))}</span><div class="grow">${esc(n)}</div><span class="sub">${n===t.captain?'创建者':'成员'}</span></div>`).join('')}${joined&&!names.includes('林清和')?'<div class="record"><span class="avatar">清</span><div class="grow">林清和 · 我</div><span class="sub">成员</span></div>':''}</div></section><div class="buttonrow">${joined?'<button class="primary" data-page="today">查看今天的行动</button><button class="secondary" data-action="invite">邀请伙伴</button>':`<button class="primary" data-jointeam="${t.id}">加入团队（模拟）</button>`}</div><div class="note">${state.myTeam&&!joined?'你已加入另一支团队。本版不擅自替你退队或转队；多团队规则后续确认。':'加入是否需要审核尚未确定，本次仅预览加入成功后的界面。'}</div>${preview()}`}
function add(id,title,detail){state.done[id]=true;state.records.unshift({title,detail});render();showToast('已保存模拟记录，未上传服务器')}
document.addEventListener('click',e=>{
 const detail=e.target.closest('[data-teamdetail]');if(detail){state.teamView=detail.dataset.teamdetail;nav('teamDetail');return}
 const join=e.target.closest('[data-jointeam]');if(join){if(state.myTeam&&state.myTeam.id!==join.dataset.jointeam){showToast('已有团队，转队与多团队规则待确认；本次不更换');return}const t=teamSamples.find(t=>t.id===join.dataset.jointeam);if(t){if(!state.myTeam)t.members++;state.myTeam=t;team=t.name;nav('teams');showToast('已加入模拟团队，没有提交到服务器')}return}
 const page=e.target.closest('[data-page]');if(page){if(state.running){state.running=false;clearInterval(tick)}nav(page.dataset.page);return}const earlyButton=e.target.closest('[data-early]');if(earlyButton){state.early=earlyButton.dataset.early;render();return}const scope=e.target.closest('[data-scope]');if(scope){state.scope=scope.dataset.scope;render();return}const rt=e.target.closest('[data-ranktype]');if(rt){state.rankType=rt.dataset.ranktype;render();return}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){
 case'searchTeam':state.teamSearch=$('#teamQuery').value.trim();render();break;
 case'createTeam':{const name=$('#teamName').value.trim(),intro=$('#teamIntro').value.trim(),city=$('#teamCity').value.trim();if(!name||!city){showToast('请填写团队名称和所在城市');return}if(state.myTeam){showToast('你已有当前团队，多团队创建规则待确认；未创建新团队');return}const t={id:'local-'+Date.now(),name,intro:intro||'一起，把成长变成日常。',city,members:1,captain:'林清和',code:'DEMO'+String(Date.now()).slice(-4),mine:true};teamSamples.push(t);state.myTeam=t;state.teamView=t.id;team=t.name;nav('teams');showToast('模拟团队已创建，刷新页面后清空');break}
 case'invite':showToast('本次模拟邀请码：'+(state.myTeam?state.myTeam.code:'—')+'；真实邀请与分享待后端接入');break;
 case'early':if(state.early==='open'&&!state.done.early)add('early','5:31早起','模拟北京时间05:31:18');break;case'ocr':state.ocr=true;render();showToast('已填入示例值；没有执行图片识别');break;case'run':{const values=[$('#distance').value,$('#minutes').value,$('#steps').value];if(values.some(v=>v.trim()===''||!Number.isFinite(Number(v))||Number(v)<0)){showToast('请填写有效的非负数值');return}if(!Number.isInteger(Number(values[2]))){showToast('步数应为整数');return}state.runData={distance:values[0],minutes:values[1],steps:values[2]};add('run','晨跑记录',`${values[0]}公里 · ${values[1]}分钟 · ${values[2]}步（示例数据）`);break}case'timer':state.running=!state.running;if(state.running){tick=setInterval(()=>{state.readSeconds++;const t=$('#readTime');if(t)t.textContent=duration(state.readSeconds)},1000)}else clearInterval(tick);render();break;case'finishRead':if(state.readSeconds===0){showToast('先开始阅读计时，再结束本次阅读');return}state.running=false;clearInterval(tick);state.lastRead=state.readSeconds;render();break;case'read':if(!$('#readComplete').checked){showToast('请先确认是否完成今日指定阅读任务');return}add('read','阅读记录',`${duration(state.lastRead)} · 自行确认完成指定任务`);break;case'visit':$('#confirm').showModal();break;case'reset':if(state.photo)URL.revokeObjectURL(state.photo);state.done={early:false,run:false,read:false,visit:false};state.records=[];state.readSeconds=0;state.lastRead=null;state.photo=null;state.ocr=false;clearInterval(tick);state.running=false;render();showToast('模拟记录已清空');break}});
document.addEventListener('change',e=>{if(e.target.id==='runPhoto'){const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)){showToast('请选择JPG或PNG图片');return}if(state.photo)URL.revokeObjectURL(state.photo);state.photo=URL.createObjectURL(file);state.ocr=false;render();showToast('图片仅在当前浏览器预览，没有上传')}});$('#cancelVisit').onclick=()=>$('#confirm').close();$('#confirmVisit').onclick=()=>{$('#confirm').close();if(!state.done.visit)add('visit','拜访记录','员工自行申报一次拜访 · 模拟记录')};render();
</script></body></html>
