<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鸿心徒步 · 页面原型 v0.1（虚构测试数据）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eff2ee; --card:#fff; --ink:#18211c; --ink2:#4c5a53; --mut:#8b988f;
  --line:#e9ece7; --green:#2f7d5a; --green2:#e8f3ed; --green3:#d6e9df;
  --gold:#b8860b; --warn:#a9690a; --warnbg:#fdf6e6; --warnline:#e6c37a;
  --red:#c0392b; --blue:#3f6ea8;
}
html,body{margin:0;padding:0}
body{
  background:#dfe4dd; color:var(--ink); min-height:100vh;
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.stage{display:flex;gap:26px;padding:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap}

/* ---------- device ---------- */
.phone{
  width:399px;height:784px;background:#14181a;border-radius:52px;padding:12px;
  box-shadow:0 26px 60px rgba(20,24,26,.28),0 2px 0 rgba(255,255,255,.35) inset;
  flex:0 0 auto;position:relative;
}
.screen{
  width:100%;height:100%;background:var(--bg);border-radius:42px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
}
.statusbar{
  height:40px;flex:0 0 40px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 2px;font-size:12px;font-weight:600;color:var(--ink);letter-spacing:.2px;
}
.statusbar .dots{display:flex;gap:3px;align-items:center}
.statusbar .bar{width:3px;border-radius:2px;background:var(--ink);opacity:.75}
.navbar{
  height:44px;flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 12px;
  position:relative;
}
.navbar .nav-title{
  position:absolute;left:0;right:0;text-align:center;font-size:16px;font-weight:600;
  pointer-events:none;letter-spacing:.3px;
}
.nav-btn{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:9px;
  background:rgba(255,255,255,.7);border:1px solid var(--line);font-size:16px;color:var(--ink2);
  cursor:pointer;line-height:1;flex:0 0 auto;z-index:2;
}
.nav-btn:active{background:#e7ebe6}
.nav-btn.ghost{background:transparent;border-color:transparent}
.viewport{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 0 18px;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth;
}
.viewport::-webkit-scrollbar{width:0}
.tabbar{
  height:54px;flex:0 0 54px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  display:flex;backdrop-filter:blur(8px);
}
.tabbar.hide{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:var(--mut);cursor:pointer;padding-top:4px}
.tab svg{width:21px;height:21px;stroke:var(--mut);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--green)}
.tab.on svg{stroke:var(--green)}

/* ---------- common ---------- */
.pad{padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 14px;
  box-shadow:0 1px 2px rgba(24,33,28,.04),0 6px 16px -12px rgba(24,33,28,.18)}
.card.tight{padding:0;overflow:hidden}
.sec{margin:16px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.sec h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
.sec .more{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:2px;cursor:pointer}
.hr{height:1px;background:var(--line);margin:0 14px}
.muted{color:var(--mut)}
.ink2{color:var(--ink2)}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.num-big{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.unit{font-size:12px;color:var(--mut);font-weight:400;margin-left:3px}

/* page tag */
.ptag{
  margin:8px 14px 0;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#7a8a80;letter-spacing:.4px;display:flex;gap:6px;align-items:center;
}
.ptag b{color:var(--green);font-weight:600}

/* tbd chip */
.tbd{
  display:inline-flex;align-items:center;font-size:10px;line-height:1.5;padding:0 5px;border-radius:6px;
  color:var(--warn);background:var(--warnbg);border:1px dashed var(--warnline);white-space:nowrap;
  cursor:help;position:relative;font-weight:500;vertical-align:baseline;
}
.tbd .tip{
  display:none;position:absolute;left:0;bottom:150%;z-index:60;width:220px;
  background:#22292a;color:#f2f5f2;font-size:11px;line-height:1.5;padding:8px 10px;border-radius:9px;
  font-weight:400;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.28);text-align:left;font-style:normal;
}
.tbd:hover .tip{display:block}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:11px;padding:2px 7px;border-radius:7px;background:#f4f6f3;color:var(--ink2);
  border:1px solid #eaeee9;display:inline-flex;gap:4px;align-items:center;
}
.chip span{color:var(--mut)}
.chip b{font-weight:600;color:var(--ink)}

/* tabs (segmented) */
.seg{display:flex;gap:6px;margin:10px 14px 4px;background:#e6eae4;padding:4px;border-radius:12px}
.seg .s{
  flex:1;text-align:center;font-size:12.5px;padding:6px 2px;border-radius:9px;color:var(--ink2);
  cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap;
}
.seg .s.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.seg.plain{background:transparent;padding:0;gap:18px;overflow-x:auto}
.seg.plain .s{flex:0 0 auto;padding:6px 0;border-radius:0;border-bottom:2px solid transparent;color:var(--mut)}
.seg.plain .s.on{background:none;box-shadow:none;color:var(--ink);border-bottom-color:var(--green);font-weight:600}

/* ranking rows */
.rank{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #f2f4f1;
  cursor:default;
}
.row:last-child{border-bottom:0}
.row.me{background:linear-gradient(90deg,#f0f8f3,#fff)}
.rk{
  width:22px;flex:0 0 22px;text-align:center;font:600 12.5px/1 ui-monospace,Menlo,monospace;color:var(--mut);
}
.rk.m1,.rk.m2,.rk.m3{
  width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;
}
.rk.m1{background:linear-gradient(135deg,#e0a92c,#c8891a)}
.rk.m2{background:linear-gradient(135deg,#a9b4bb,#8b98a0)}
.rk.m3{background:linear-gradient(135deg,#c58a5b,#a9713f)}
.rname{flex:1;min-width:0;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{font-size:11px;color:var(--mut);font-weight:400;margin-top:1px}
.rval{font:600 13.5px/1.2 ui-monospace,Menlo,monospace;text-align:right;white-space:nowrap}
.rval small{display:block;font:400 10px/1.4 -apple-system,sans-serif;color:var(--mut);letter-spacing:0}

/* avatar */
.av{
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:var(--c,#8aa79a);color:#fff;font-size:11px;font-weight:600;flex:0 0 auto;
  letter-spacing:-.3px;
}
.avc{border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--c,#8aa79a);color:#fff;font-weight:700;flex:0 0 auto}

/* buttons */
.btn{
  display:block;width:100%;text-align:center;padding:12px;border-radius:13px;font-size:14.5px;font-weight:600;
  background:var(--green);color:#fff;border:0;cursor:pointer;letter-spacing:.3px;
}
.btn:active{filter:brightness(.95)}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--green3)}
.btn.grey{background:#eef0ed;color:var(--mut);border:1px solid var(--line);cursor:not-allowed}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btn-row{display:flex;gap:10px;margin:12px 14px 0}

/* inputs */
.field{margin:0 0 14px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.field .req{color:var(--red);margin-left:2px}
.input,.ta{
  width:100%;border:1px solid var(--line);background:#fafbfa;border-radius:11px;padding:10px 12px;
  font-size:13.5px;color:var(--ink);outline:none;font-family:inherit;
}
.ta{min-height:96px;resize:none;line-height:1.6}
.input:focus,.ta:focus{border-color:var(--green3);background:#fff}
.counter{text-align:right;font-size:11px;color:var(--mut);margin-top:4px}
.hint{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.5}

/* list cells */
.cell{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid #f2f4f1;cursor:pointer}
.cell:last-child{border-bottom:0}
.cell .lab{flex:1;font-size:13.5px}
.cell .val{font-size:12.5px;color:var(--mut);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .arrow{color:#c3ccc6;font-size:15px}

/* note cards */
.notecard{padding:14px;border-bottom:1px solid #f2f4f1}
.notecard:last-child{border-bottom:0}
.nhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nhead .who{flex:1;min-width:0}
.nhead .who .n{font-size:12.5px;font-weight:600}
.nhead .who .t{font-size:10.5px;color:var(--mut)}
.ntext{font-size:13.5px;line-height:1.65;color:#22302a;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ntext.open{-webkit-line-clamp:unset;display:block}
.nimgs{display:flex;gap:6px;margin-top:9px}
.nimgs .im{width:78px;height:78px;border-radius:10px;background:linear-gradient(135deg,#d8e5db,#c6dbcd);display:flex;align-items:center;justify-content:center;font-size:19px;color:#6d8b7c}
.nfoot{display:flex;align-items:center;gap:14px;margin-top:9px;font-size:11px;color:var(--mut)}
.nfoot .lk{cursor:pointer}
.nfoot .del{color:#c2705f;cursor:pointer}

/* misc */
.empty{padding:34px 20px;text-align:center;color:var(--mut);font-size:12.5px}
.empty .big{font-size:26px;opacity:.5;margin-bottom:8px}
.skel{height:44px;margin:8px 12px;border-radius:10px;background:linear-gradient(90deg,#eef1ed,#e4e9e4,#eef1ed);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
.end{text-align:center;font-size:11px;color:#b3beb7;padding:14px 0 4px}
.cover{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:0 0 auto}
.badge{font-size:10px;padding:1px 6px;border-radius:5px;background:#f0f2ef;color:var(--ink2);border:1px solid #e7ebe6}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnline)}
.badge.ok{background:#eaf5ee;color:#2f7d5a;border-color:#cfe6d8}
.badge.grey{background:#f3f4f2;color:#94a09a}
.notice{
  margin:10px 14px;padding:10px 12px;border-radius:12px;background:#f6f8f5;border:1px solid #e7ebe6;
  font-size:11.5px;line-height:1.65;color:var(--ink2);
}
.notice b{color:var(--ink);font-weight:600}
.notice.warn{background:var(--warnbg);border-color:#f0dcb4;color:#8a6a20}
.notice.info{background:#f2f6fb;border-color:#dfe8f3;color:#3f5f86}
.calc{font:11px/1.5 ui-monospace,Menlo,monospace;color:#6f8077;background:#f5f7f4;border-radius:7px;padding:2px 6px;display:inline-block}

/* home hero */
.hero{margin:12px 14px 0;border-radius:20px;padding:16px;background:linear-gradient(150deg,#2f7d5a,#276a4c 55%,#1f5741);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .who{display:flex;align-items:center;gap:9px;font-size:13px;opacity:.95}
.hero .grid{display:flex;margin-top:14px;gap:8px}
.hero .cellw{flex:1}
.hero .lab{font-size:11px;opacity:.75}
.hero .val{font:700 21px/1.2 ui-monospace,Menlo,monospace;margin-top:2px}
.hero .val small{font:400 10px/1 -apple-system,sans-serif;opacity:.8;margin-left:2px}
.upload{
  position:absolute;right:14px;bottom:14px;width:74px;height:74px;border-radius:50%;
  background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.5);display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.3;
  text-align:center;cursor:pointer;color:#fff;gap:2px;backdrop-filter:blur(2px);
}
.upload .ic{font-size:17px}
.hstats{display:flex;margin:10px 14px 0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(24,33,28,.04)}
.hstats .st{flex:1;padding:10px 8px;text-align:center;border-right:1px solid #f0f2ef}
.hstats .st:last-child{border-right:0}
.hstats .v{font:700 15px/1.3 ui-monospace,Menlo,monospace}
.hstats .l{font-size:10.5px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:3px;margin-top:1px}

/* course */
.course{display:flex;gap:10px;padding:12px;border-bottom:1px solid #f2f4f1;cursor:pointer}
.course:last-child{border-bottom:0}
.course .cv{width:98px;height:66px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;text-align:center;padding:4px;line-height:1.3}
.course .ci{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.course .ct{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.course .cm{font-size:10.5px;color:var(--mut);display:flex;gap:8px;margin-top:4px}

/* team detail */
.tcover{height:132px;position:relative;display:flex;align-items:flex-end;padding:14px;color:#fff}
.tcover .ttl{font-size:19px;font-weight:700;letter-spacing:.3px}
.tcover .slo{font-size:11.5px;opacity:.85;margin-top:3px}
.tcover .rkline{position:absolute;right:14px;top:12px;background:rgba(0,0,0,.28);border-radius:9px;padding:4px 9px;font-size:10.5px;backdrop-filter:blur(4px)}
.tbtab{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tbtab .x{flex:1;text-align:center;padding:11px 0;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
.tbtab .x.on{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}

/* sheet */
.sheet{position:absolute;inset:0;background:rgba(20,26,22,.42);display:none;align-items:flex-end;z-index:80}
.sheet.on{display:flex}
.sheet .panel{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px 22px;max-height:78%;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h4{margin:0 0 8px;font-size:15px}
.sheet ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.75;color:var(--ink2)}
.sheet .close{margin-top:14px}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
  background:rgba(28,36,31,.92);color:#fff;font-size:12px;padding:9px 14px;border-radius:10px;
  opacity:0;transition:.22s;z-index:90;max-width:290px;text-align:center;line-height:1.5;pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(-50%)}

/* guide */
.guide{width:342px;flex:0 0 auto;background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 30px -18px rgba(20,24,26,.35);max-height:784px;overflow:auto}
.guide h2{margin:0 0 4px;font-size:15px;letter-spacing:.3px}
.guide .sub{font-size:11.5px;color:var(--mut);line-height:1.6;margin-bottom:12px}
.guide h5{margin:14px 0 6px;font-size:11px;letter-spacing:1px;color:#8b988f;font-weight:600;text-transform:uppercase}
.glist{display:flex;flex-direction:column;gap:2px}
.gitem{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12.5px;cursor:pointer;
  color:var(--ink2);border:1px solid transparent;
}
.gitem:hover{background:#f5f8f4;border-color:#e9ece7}
.gitem .id{font:10px/1 ui-monospace,Menlo,monospace;color:#9aa79f;min-width:52px}
.gitem.on{background:var(--green2);color:var(--green);border-color:var(--green3);font-weight:600}
.gstates{display:flex;flex-wrap:wrap;gap:6px}
.gstates button{
  font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid #e3e8e2;background:#fafbfa;
  color:var(--ink2);cursor:pointer;font-family:inherit;
}
.gstates button.on{background:var(--green);color:#fff;border-color:var(--green)}
.legend{font-size:11.5px;line-height:1.8;color:var(--ink2)}
.legend .tbd{margin:0 2px}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="statusbar">
        <span id="clock">9:41</span>
        <span class="dots">
          <span class="bar" style="height:5px"></span>
          <span class="bar" style="height:7px"></span>
          <span class="bar" style="height:9px"></span>
          <span class="bar" style="height:11px"></span>
        </span>
      </div>
      <div class="navbar">
        <div class="nav-btn ghost" id="btnBack" style="visibility:hidden">‹</div>
        <div class="nav-btn ghost" id="btnHome" style="visibility:hidden">⌂</div>
        <div class="nav-title" id="navTitle">首页</div>
        <div style="flex:1"></div>
        <span class="badge grey" style="z-index:2;font-size:9px">原型</span>
      </div>
      <div class="viewport" id="view"></div>
      <div class="tabbar" id="tabbar"></div>
      <div class="sheet" id="sheet">
        <div class="panel" id="sheetPanel"></div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <aside class="guide">
    <h2>鸿心徒步 · 页面原型 v0.1</h2>
    <div class="sub">
      全部数据为<b>虚构测试数据</b>，不连接任何旧系统。虚线「待确认」标签表示该规则文档未确认，原型<b>不执行</b>相关逻辑。此文件是页面原型，不含任何后端实现。
    </div>

    <h5>状态演示</h5>
    <div class="gstates" id="gstates"></div>

    <h5>页面索引（点击跳转）</h5>
    <div class="glist" id="glist"></div>

    <h5>图例</h5>
    <div class="legend">
      <span class="tbd">待确认<i class="tip">文档未确认的业务规则。原型只展示位置，不实现计算或提交。</i></span> 未知规则<br>
      <span class="badge ok">已确认</span> 文档中有页面事实依据<br>
      <span class="badge grey">入口</span> 有按钮但内部未验证<br>
      <span class="badge warn">未核实</span> 无法读到，不补猜
    </div>

    <h5>覆盖范围</h5>
    <div class="legend">
      B01–B10 全部排行榜<b>独立呈现</b>（B08 分 a/b/c 三页签）；<br>
      普通笔记 N01–N14 与学习笔记 C03–C14 <b>分开</b>；<br>
      首页队伍榜与个人中心队伍榜<b>不合并</b>。
    </div>
  </aside>
</div>

<script>
/* ==========================================================
   鸿心徒步 页面原型 v0.1
   数据全部虚构；规则依据 docs/PRD.md 与 docs/FEATURE_INVENTORY.md
   ========================================================== */

const T = (note) => `<span class="tbd">待确认<i class="tip">${note}</i></span>`;

/* ---------------- 虚构数据 ---------------- */
const ME = {
  nick: '林清和', realName: '林清和', phone: '138****6021',
  todaySteps: 3210, totalSteps: 34260,
  teamId: 't1'
};

/* ---------------- 工具 ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => Number(n).toLocaleString('en-US');
const hue = s => { let h=0; for (const ch of String(s)) h = (h*31 + ch.codePointAt(0)) % 360; return `hsl(${h} 28% 48%)`; };
const av = (name, size=30) =>
  `<span class="av" style="--c:${hue(name)};width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px">${esc(name.slice(-2))}</span>`;
const coverBox = (t, color, w=44, h=44) =>
  `<span class="avc" style="--c:${color};width:${w}px;height:${h}px">${esc(t)}</span>`;
const ptag = (ids) => `<div class="ptag"><b>${ids.join(' · ')}</b></div>`;

function scopeCard(rows){
  return `<div class="chips" style="margin-top:8px">${rows.map(([k,v]) => `<span class="chip"><span>${k}</span>${v}</span>`).join('')}</div>`;
}

const DEMO = { state:'normal' };
const ST = {
  normal:'正常', loading:'加载中', empty:'空列表', error:'加载失败', forbidden:'无权限'
};

/* 通用列表状态包装 */
function listState(renderRows, count){
  const s = DEMO.state;
  if (s === 'loading') return `<div class="card tight"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
  if (s === 'empty') return `<div class="card tight"><div class="empty"><div class="big">◌</div>暂无数据</div></div>`;
  if (s === 'error') return `<div class="card tight"><div class="empty"><div class="big">!</div>加载失败，点击重试<br><span style="font-size:11px">失败时不显示为真实的 0（AT 验收要求）</span></div></div>`;
  if (s === 'forbidden') return `<div class="card tight"><div class="empty"><div class="big">⛔</div>无权限查看<br><span style="font-size:11px">服务端应返回 403，而不是仅隐藏入口</span></div></div>`;
  return renderRows();
}

/* ---------------- 排行榜通用渲染 ---------------- */
function rankRows(items, opt){
  const { value, sub, medal=true, avatar=true, meKey='me' } = opt;
  return items.map((it, i) => {
    const r = i+1;
    const cls = medal && r<=3 ? `m${r}` : '';
    const lead = avatar && it.name
      ? av(it.name, 28)
      : coverBox((it.cover||it.name||'').slice(0,1), it.color || '#8aa79a', 30, 30);
    const sVal = sub ? sub(it) : '';
    return `<div class="row ${it[meKey]?'me':''}">
      <span class="rk ${cls}">${r}</span>
      ${lead}
      <div class="rname">${esc(it.name)}${it[meKey]?' <span class="badge ok" style="font-size:9px">我</span>':''}
        ${sVal?`<div class="rsub">${sVal}</div>`:''}
      </div>
      <div class="rval">${value(it)}</div>
    </div>`;
  }).join('');
}

const TABS = [['home','首页'],['reading','共读'],['feed','动态'],['notes','笔记'],['mine','我的']];

let stack = [{ sid:'home', p:{} }];

function cur(){ return stack[stack.length-1]; }

function nav(sid, p){
  if (!SCREENS[sid]) return;
  const c = cur();
  if (c.sid === sid && sid !== 'profile' && sid !== 'myTeams') { /* 允许重复进入子页 */ }
  stack.push({ sid, p: p || {} });
  render();
  document.getElementById('view').scrollTop = 0;
}

function back(){
  if (stack.length > 1){ stack.pop(); render(); }
}

function render(){
  const c = cur();
  const s = SCREENS[c.sid];
  document.getElementById('navTitle').textContent = s.title;

  const isTab = !!s.tab;
  const backEl = document.getElementById('btnBack');
  const homeEl = document.getElementById('btnHome');
  backEl.style.visibility = stack.length > 1 ? 'visible' : 'hidden';
  homeEl.style.visibility = stack.length > 1 ? 'visible' : 'hidden';

  const view = document.getElementById('view');
  view.innerHTML = s.render(c.p || {});

  const tb = document.getElementById('tabbar');
  tb.className = 'tabbar' + (isTab ? '' : ' hide');
  tb.innerHTML = TABS.map(([id,label])=>{
    const on = s.tab === id;
    return `<div class="tab ${on?'on':''}" data-tab="${id}">
      <svg viewBox="0 0 24 24">${ICONS[id]}</svg><span>${label}</span></div>`;
  }).join('');

  // 高亮导览
  document.querySelectorAll('.gitem').forEach(el=>{
    el.classList.toggle('on', el.dataset.go === c.sid);
  });

  // 计数器绑定
  bindCounters();
}

function bindCounters(){
  const map = [['sloganInput','sloganCount'],['studyText','studyCount'],['noteText','noteCount'],['msgInput','msgCount']];
  map.forEach(([inputId, outId])=>{
    const i = document.getElementById(inputId);
    const o = document.getElementById(outId);
    if (!i || !o) return;
    o.textContent = i.value.length;
    i.addEventListener('input', ()=>{
      o.textContent = i.value.length;
    });
  });
}

  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* 事件 */
document.addEventListener('click', (e)=>{
  const tbdEl = e.target.closest('.tbd');
  if (tbdEl){
    const tip = tbdEl.querySelector('.tip');
    if (tip) toast('待确认：' + tip.textContent);
    return;
  }
  const el = e.target.closest('[data-go],[data-toast],[data-sheet],[data-tab],[data-closesheet],[data-home-tab],[data-team-tab],[data-class-tab],[data-note-tab],[data-read-tab],[data-book-tab],[data-rank-tab],[data-state],[data-toggle],[data-validate],[data-expand-btn]');
  if (!el) {
    if (e.target.id === 'sheet') closeSheet();
    return;
  }

  if (el.hasAttribute('data-closesheet')) { closeSheet(); return; }
  if (el.dataset.go){
    let p = {};
    if (el.dataset.p) { try { p = JSON.parse(el.dataset.p); } catch(_){} }
    nav(el.dataset.go, p);
    return;
  }
  if (el.dataset.tab){ stack = [{ sid: el.dataset.tab, p:{} }]; render(); return; }
  if (el.dataset.toast){ toast(el.dataset.toast); return; }
  if (el.dataset.sheet){ openSheet(el.dataset.sheet); return; }
  if (el.dataset.homeTab){ window.__homeTab = el.dataset.homeTab; render(); return; }
  if (el.dataset.teamTab){ window.__teamTab = el.dataset.teamTab; render(); return; }
  if (el.dataset.classTab){ window.__classTab = el.dataset.classTab; render(); return; }
  if (el.dataset.noteTab){ window.__noteTab = el.dataset.noteTab; render(); return; }
  if (el.dataset.readTab){ window.__readTab = el.dataset.readTab; render(); return; }
  if (el.dataset.bookTab){ window.__bookTab = el.dataset.bookTab; render(); return; }
  if (el.dataset.rankTab){ window.__rankTab = el.dataset.rankTab; render(); return; }

  if (el.dataset.state !== undefined){
    DEMO.state = el.dataset.state;
    document.querySelectorAll('#gstates button').forEach(b=>b.classList.toggle('on', b.dataset.state===DEMO.state));
    render();
    return;
  }
  if (el.hasAttribute('data-toggle')){
    const on = el.dataset.on === '1';
    el.dataset.on = on ? '0' : '1';
    el.style.background = on ? '#e7ebe6' : '#2f7d5a';
    el.firstElementChild.style.left = on ? '2px' : '20px';
    return;
  }
  if (el.dataset.expandBtn){
    const t = el.closest('.notecard').querySelector('.ntext');
    const open = t.classList.toggle('open');
    el.textContent = open ? '收起' : 'C07 展开全文';
    return;
  }
  if (el.dataset.validate === 'nick'){
    const v = (document.getElementById('nickInput').value || '').trim();
    const err = document.getElementById('nickErr');
    if (!/^[\u4e00-\u9fa5A-Za-z0-9]+$/.test(v)){
      err.style.display = 'block';
      err.textContent = '昵称只能包含字母、数字、汉字，不能使用特殊字符（已确认规则）。';
      return;
    }
    err.style.display = 'none';
    toast('校验通过。原型不写库；真实保存需服务端再次校验。');
    return;
  }
});

document.getElementById('btnBack').addEventListener('click', back);
document.getElementById('btnHome').addEventListener('click', ()=>{ stack = [{ sid:'home', p:{} }]; render(); });

/* 时钟 */
function tick(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const el = document.getElementById('clocksec');
  if (el) el.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  const hv = document.getElementById('hv');
  if (hv) hv.textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

buildGuide();
render();
tick();
setInterval(tick, 1000);
</script>
